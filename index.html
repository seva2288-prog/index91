<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Футбольные прогнозы</title>
</head>
<body>
    <h3>Загрузка футбольных данных...</h3>

    <script>
        // ВСТАВЬТЕ СЮДА ВАШ API-KEY ОТ API-FOOTBALL
        const API_KEY = "40a548b23a46b859463c5bf4d4698aa1";
        
        // ID Английской Премьер-Лиги (работает 100%)
        const LEAGUE_ID = 39; 
        const SEASON = 2024; 

        // Прокси для обхода блокировок браузера
        const PROXY_URL = "https://corsproxy.io/?";
        
        const API_URL = `https://v3.football.api-sports.io/fixtures?league=${LEAGUE_ID}&season=${SEASON}`;

        function generateTestPredictions() {
            return fetch(PROXY_URL + заAPI_URL, {
                method: 'GET',
                headers: {
                    'x-apisports-key': API_KEY
                }
            }).then(response => {
                if (!response.ok) {
                    throw new Error(`Ошибка HTTP: ${response.status}`);
                }
                return response.json();
            });
        }

        // Функция, чтобы превратить дату из API в красивый текст
        function formatDate(isoString) {
            const date = new Date(isoString);
            return date.toLocaleString('ru-RU', {
                day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit'
            });
        }

        // --- ЗАПУСК ---
        generateTestPredictions()
        .then(data => {
            if (!data || !data.response || data.response.length === 0) {
                document.body.innerHTML = '<h3 style="color: orange;">Нет данных по этому чемпионату.</h3>';
                return;
            }

            const matches = data.response;

            // Начинаем формировать красивую HTML страницу
            let htmlContent = '<h3>РЕЗУЛЬТАТЫ ЗАГРУЗКИ (АПЛ 2024):</h3>';
            htmlContent += `<p><i>Всего найдено матчей: ${matches.length}</i></p><hr>`;

            // Выводим каждый матч
            matches.forEach((match, index) => {
                const home = match.teams.home.name;
                const away = match.teams.away.name;
                const date = formatDate(match.fixture.date);
                const status = match.fixture.status.short;

                // Добавляем информацию в HTML
                htmlContent += `
                    <div style="border-bottom: 1px solid #eee; padding: 10px 0;">
                        <b>Матч ${index + 1}:</b> ${home} vs ${away} <br>
                        <span style="color: #555; font-size: 0.9em;">📅 ${date}</span>
                        <span style="background: #f0f0f0; padding: 2px 6px; border-radius: 4px; font-size: 0.8em; margin-left: 10px;">${status}</span>
                    </div>
                `;
            });

            // Выводим всё на экран
            document.body.innerHTML = htmlContent;

        })
        .catch(error => {
            console.error("Ошибка:", error);
            document.body.innerHTML = '<h3 style="color:red;">ОШИБКА ЗАГРУЗКИ ДАННЫХ:</h3>' +
                                      '<p style="color:red;">' + error + '</p>';
        });
    </script>
</body>
</html>
